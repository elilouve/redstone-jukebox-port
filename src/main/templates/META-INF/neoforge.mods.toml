modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Tau-ri-Dev/Mod-RS-Jukeboxes/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Integration ComputerCraft facultative : chargee apres CC: Tweaked s'il est present
[[dependencies.${mod_id}]]
    modId="computercraft"
    type="optional"
    versionRange="*"
    ordering="AFTER"
    side="BOTH"
